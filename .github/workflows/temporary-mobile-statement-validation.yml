name: Temporary mobile statement validation

on:
  push:
    branches:
      - fix/standardize-mobile-statement-lifecycle

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
