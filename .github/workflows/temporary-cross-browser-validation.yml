name: Temporary cross-browser validation

on:
  push:
    branches:
      - fix/cross-browser-gesture-ownership

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run cross-browser regression tests
        run: >
          node --test
          tests/crossBrowserGestureOwnership.test.js
          tests/featuredProjectsTouchNavigation.test.js
          tests/featuredProjectsGallery.test.js
          tests/homeConstructionHint.test.js
          tests/homeScrollNavigation.test.js
          tests/statementVideoPlayback.test.js
      - name: Record full-suite baseline
        continue-on-error: true
        run: npm test
      - run: npm run build
