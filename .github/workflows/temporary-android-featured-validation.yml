name: Temporary Android Featured validation

on:
  push:
    branches:
      - fix/android-featured-touch-capability

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Featured mobile navigation tests
        run: node --test tests/featuredProjectsTouchNavigation.test.js tests/featuredMobileAxisOwnership.test.js tests/crossBrowserGestureOwnership.test.js tests/featuredProjectsGallery.test.js
      - name: Regression suite excluding known Contact baseline
        run: node --test $(find tests -name '*.test.js' ! -name 'contactSection.test.js' | sort)
      - run: npm run build
