name: Temporary iOS services card validation

on:
  push:
    branches:
      - fix/ios-services-card-clipping

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Services card tests
        run: node --test tests/servicesCardLayout.test.js tests/servicesProgress.test.js
      - name: Regression suite excluding known Contact baseline
        run: node --test $(find tests -name '*.test.js' ! -name 'contactSection.test.js' | sort)
      - run: npm run build
