name: Temporary contact card cross-browser validation

on:
  push:
    branches:
      - fix/contact-card-cross-browser-rendering

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Contact card tests
        run: node --test tests/contactCardCrossBrowser.test.js tests/contactLinks.test.js
      - name: Regression suite excluding known Contact baseline
        run: node --test $(find tests -name '*.test.js' ! -name 'contactSection.test.js' | sort)
      - run: npm run build
